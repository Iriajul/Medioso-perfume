# ─── Mad Perfume Nginx Configuration ──────────────────────────────────
# Ansible renders this as a Jinja template for BOTH environments;
# {{ api_host }} / {{ admin_host }} come from group_vars/<env>.yml.
# Certbot auto-adds the SSL (443) blocks.


# Backend API (Django REST Framework) — consumed by the mobile app + dashboard
server {
    listen 80;
    server_name {{ api_host }};
    client_max_body_size 25M;

    include /etc/nginx/conf.d/security-headers.conf;

    location / {
        include /etc/nginx/conf.d/proxy-params.conf;
        proxy_pass http://127.0.0.1:8000;
        limit_req zone=api_limit burst=20 nodelay;
    }

    location /static/ {
        include /etc/nginx/conf.d/proxy-params.conf;
        proxy_pass http://127.0.0.1:8000;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        include /etc/nginx/conf.d/proxy-params.conf;
        proxy_pass http://127.0.0.1:8000;
        expires 30m;
    }
}


# Admin dashboard (Next.js)
server {
    listen 80;
    server_name {{ admin_host }};
    # Image uploads go through Next.js server actions (10MB max + multipart overhead).
    client_max_body_size 12M;

    include /etc/nginx/conf.d/security-headers.conf;

    location / {
        include /etc/nginx/conf.d/proxy-params.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    location /_next/static/ {
        include /etc/nginx/conf.d/proxy-params.conf;
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
