# ─── Base Compose ─────────────────────────────────────────────────────
# Shared service definitions inherited by local/staging/production.
# Usage: docker compose -f docker-compose.base.yml -f <env>/docker-compose.yml up

x-common-env: &common-env
  restart: unless-stopped

services:

  backend:
    <<: *common-env
    container_name: ${PROJECT_NAME:-madperfume}-backend
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "X-Forwarded-Proto: https", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network

  frontend:
    <<: *common-env
    container_name: ${PROJECT_NAME:-madperfume}-frontend
    # Published only to the host loopback; nginx exposes it as admin.<domain>.
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-network

volumes:
  media_data:
    driver: local
  static_data:
    driver: local

networks:
  app-network:
    driver: bridge
