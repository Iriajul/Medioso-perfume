# ─── Production Compose ───────────────────────────────────────────────
# Usage: docker compose -f ../docker-compose.base.yml -f docker-compose.yml up -d
#
# Pulls pre-built images from Amazon ECR (pushed by CI/CD).

services:

  backend:
    image: ${REGISTRY}/madperfume-backend:${IMAGE_TAG:-latest}
    env_file:
      - ../environments/.env.production.backend
    restart: always

  frontend:
    # Defaults to the backend release tag. A rollback can select a separately
    # known-compatible frontend release through FRONTEND_IMAGE_TAG.
    image: ${REGISTRY}/madperfume-frontend:${FRONTEND_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    env_file:
      - ../environments/.env.production.frontend
    restart: always
