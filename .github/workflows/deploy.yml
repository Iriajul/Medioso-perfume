name: Mad Perfume CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

# OIDC: lets this workflow request a short-lived token to assume the AWS role.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # Which services changed in this push; manual runs rebuild both.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            backend:
              - 'services/backend/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'services/frontend/**'
              - '.github/workflows/deploy.yml'

  # ─── Build & Push to ECR ────────────────────────────────────────────
  build:
    name: Build & Push Images to ECR
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The server deploys every service at this commit's SHA tag. For a service
      # that didn't change, point the SHA tag at its current :latest image instead
      # of rebuilding. If there is no :latest yet (first deploy), build it.
      - name: Reuse unchanged images
        id: reuse
        env:
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
        run: |
          retag() {
            local repo=$1 manifest type
            manifest=$(aws ecr batch-get-image --repository-name "$repo" --image-ids imageTag=latest \
              --query 'images[0].imageManifest' --output text 2>/dev/null) || return 1
            type=$(aws ecr batch-get-image --repository-name "$repo" --image-ids imageTag=latest \
              --query 'images[0].imageManifestMediaType' --output text)
            [ -n "$manifest" ] && [ "$manifest" != "None" ] || return 1
            aws ecr put-image --repository-name "$repo" --image-tag "$GITHUB_SHA" \
              --image-manifest "$manifest" --image-manifest-media-type "$type" >/dev/null
          }
          for svc in backend frontend; do
            changed_var="${svc^^}_CHANGED"
            if [ "${!changed_var}" = "true" ]; then build=true
            elif retag "madperfume-$svc"; then build=false; echo "Reused madperfume-$svc:latest as $GITHUB_SHA"
            else build=true; fi
            echo "build_$svc=$build" >> "$GITHUB_OUTPUT"
          done

      - name: Build & push backend
        if: steps.reuse.outputs.build_backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./services/backend
          file: ./services/backend/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/madperfume-backend:latest
            ${{ steps.login-ecr.outputs.registry }}/madperfume-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        if: steps.reuse.outputs.build_frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./services/frontend
          file: ./services/frontend/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/madperfume-frontend:latest
            ${{ steps.login-ecr.outputs.registry }}/madperfume-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PRODUCTION_API_URL || 'https://api.bpmstudio.pt' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ─── Deploy to Production (via SSM — no inbound SSH) ────────────────
  deploy:
    name: Deploy to Production via SSM
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy on the instance via SSM Run Command
        env:
          REGISTRY: ${{ needs.build.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Resolve the running production instance by tag.
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=madperfume-production" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "Target instance: $INSTANCE_ID"

          # Tell SSM to run the on-box deploy script as the ubuntu user.
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Mad Perfume deploy $TAG" \
            --parameters "commands=sudo -u ubuntu env DEPLOY_ENV=production REGISTRY=$REGISTRY IMAGE_TAG=$TAG AWS_REGION=$AWS_REGION bash /home/ubuntu/madperfume/server-deploy.sh" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          # Wait for completion (waiter returns non-zero on failure).
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          echo "::group::Deploy stdout"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "::endgroup::"
          echo "::group::Deploy stderr"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          echo "::endgroup::"

          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "Deploy status: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1
