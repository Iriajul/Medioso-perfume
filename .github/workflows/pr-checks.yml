name: Mad Perfume PR Checks

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  # Which areas this PR touches. Jobs for untouched services are skipped, and a
  # skipped required check still counts as passed for branch protection.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'services/backend/**'
              - '.github/workflows/pr-checks.yml'
            frontend:
              - 'services/frontend/**'
              - '.github/workflows/pr-checks.yml'

  # Independent jobs so a failure in one service's checks never blocks or
  # skips another's -- each area's status reflects only its own code.
  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        working-directory: services/backend
        run: uv python install

      - name: Install backend dependencies
        working-directory: services/backend
        run: uv sync --frozen

      - name: Run Django checks
        working-directory: services/backend
        run: |
          uv run python manage.py check --settings=core.settings.test
          uv run python manage.py makemigrations --check --dry-run --settings=core.settings.test

      - name: Run backend tests
        working-directory: services/backend
        run: uv run python manage.py test --settings=core.settings.test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Reuses the deploy workflows' layer cache, so unchanged layers aren't rebuilt.
      - name: Validate backend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./services/backend
          file: ./services/backend/Dockerfile
          target: prod
          push: false
          cache-from: |
            type=gha,scope=backend-staging
            type=gha,scope=backend-pr
          cache-to: type=gha,mode=max,scope=backend-pr

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        working-directory: services/frontend
        run: npm ci

      - name: Lint
        working-directory: services/frontend
        run: npm run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The prod image stage runs `next build` (type check + compile), so this
      # one step covers the build check; no separate `npm run build`.
      - name: Build (production image)
        uses: docker/build-push-action@v5
        with:
          context: ./services/frontend
          file: ./services/frontend/Dockerfile
          target: prod
          push: false
          cache-from: |
            type=gha,scope=frontend-staging
            type=gha,scope=frontend-pr
          cache-to: type=gha,mode=max,scope=frontend-pr

  infra:
    name: Infra Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Compose Validation ───────────────────────────────────────
      - name: Validate docker-compose files
        env:
          REGISTRY: example.dkr.ecr.us-east-1.amazonaws.com
        run: |
          # Remote env files are gitignored; stub them from the examples.
          for f in deployment/environments/.env.*.example; do cp "$f" "${f%.example}"; done
          for env in local staging production; do
            docker compose \
              -f deployment/compose/docker-compose.base.yml \
              -f deployment/compose/$env/docker-compose.yml config --quiet
          done

      # ─── Terraform Validate ───────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infrastructure/terraform/

      - name: Terraform Validate
        run: |
          for d in bootstrap environments/production environments/staging; do
            (cd infrastructure/terraform/$d && terraform init -backend=false && terraform validate)
          done
